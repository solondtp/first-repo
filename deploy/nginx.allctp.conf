server {
    listen 80;
    server_name allctp.com www.allctp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name allctp.com www.allctp.com;

    ssl_certificate /etc/letsencrypt/live/allctp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allctp.com/privkey.pem;

    location / {
        root /var/www/allctp/frontend-dist;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 强制禁止公网访问 OpenClaw hooks
    location /hooks/ {
        return 403;
    }
}
